<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rexi — Establecer Contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans:['Inter','sans-serif'], display:['Outfit','sans-serif'] }, colors: { primary: { 50:'#f0fdfa',500:'#14b8a6',600:'#0d9488',700:'#0f766e' } } } } }
    const t = {
      es: { title:'Crea tu contraseña', subtitle:'Bienvenido a Rexi. Establece una contraseña segura para activar tu cuenta.', newLabel:'Nueva contraseña', confirmLabel:'Confirmar contraseña', req1:'Mínimo 8 caracteres', req2:'Al menos una mayúscula', req3:'Al menos un número', btn:'Activar cuenta', successTitle:'¡Cuenta activada!', successDesc:'Tu contraseña ha sido establecida. Ya puedes iniciar sesión.', goLogin:'Ir al inicio de sesión' },
      en: { title:'Create your password', subtitle:'Welcome to Rexi. Set a secure password to activate your account.', newLabel:'New password', confirmLabel:'Confirm password', req1:'Minimum 8 characters', req2:'At least one uppercase letter', req3:'At least one number', btn:'Activate account', successTitle:'Account activated!', successDesc:'Your password has been set. You can now sign in.', goLogin:'Go to sign in' }
    };
    let lang = 'es';
    function setLang(l) {
      lang = l;
      document.querySelectorAll('[data-lang-btn]').forEach(b => b.classList.toggle('font-bold', b.dataset.langBtn === l));
      ['title','subtitle','newLabel','confirmLabel','req1','req2','req3','btn','successTitle','successDesc','goLogin'].forEach(id => {
        if(document.getElementById(id)) document.getElementById(id).textContent = t[l][id];
      });
    }
    function checkStrength(val) {
      let score = 0;
      const r1 = val.length >= 8, r2 = /[A-Z]/.test(val), r3 = /[0-9]/.test(val);
      [['req1', r1],['req2', r2],['req3', r3]].forEach(([id, ok]) => {
        const el = document.getElementById(id);
        el.className = `flex items-center gap-2 text-sm ${ok ? 'text-emerald-600' : 'text-slate-400'}`;
        el.querySelector('span').textContent = ok ? '✓' : '○';
      });
      score = (r1?1:0)+(r2?1:0)+(r3?1:0);
      const bar = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');
      const configs = [[0,'bg-slate-200','',0],[1,'bg-red-400','Débil',33],[2,'bg-amber-400','Media',66],[3,'bg-emerald-500','Fuerte',100]];
      const [,cls,txt,pct] = configs[score];
      bar.className = `h-2 rounded-full transition-all duration-300 ${cls}`;
      bar.style.width = pct + '%';
      label.textContent = txt;
      label.className = `text-xs font-medium ${score===3?'text-emerald-600':score===2?'text-amber-600':'text-red-500'}`;
    }
    function submit(e) {
      e.preventDefault();
      document.getElementById('formState').classList.add('hidden');
      document.getElementById('successState').classList.remove('hidden');
    }
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary-50 to-slate-100 font-sans flex items-center justify-center px-4 py-12" onload="setLang('es')">
  <div class="w-full max-w-md">

    <!-- Lang switcher -->
    <div class="flex justify-end mb-6">
      <div class="flex items-center gap-1 bg-white rounded-xl p-1 shadow-sm border border-slate-200">
        <button data-lang-btn="es" onclick="setLang('es')" class="px-3 py-1.5 rounded-lg text-sm font-bold text-slate-700">ES</button>
        <button data-lang-btn="en" onclick="setLang('en')" class="px-3 py-1.5 rounded-lg text-sm text-slate-400 hover:bg-slate-50">EN</button>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 md:p-10">

      <!-- Logo -->
      <div class="flex items-center gap-3 mb-8">
        <div class="w-12 h-12 bg-primary-600 rounded-2xl flex items-center justify-center shadow-lg shadow-primary-600/30">
          <span class="text-white font-display font-bold text-2xl">R</span>
        </div>
        <span class="font-display font-bold text-xl text-slate-900">Rexi</span>
      </div>

      <!-- Form state -->
      <div id="formState">
        <h1 id="title" class="font-display font-bold text-2xl text-slate-900 mb-2">Crea tu contraseña</h1>
        <p id="subtitle" class="text-slate-500 text-sm mb-8">Bienvenido a Rexi. Establece una contraseña segura para activar tu cuenta.</p>

        <form onsubmit="submit(event)" class="space-y-5">
          <!-- New password -->
          <div>
            <label id="newLabel" for="newPassword" class="block text-sm font-medium text-slate-700 mb-2">Nueva contraseña</label>
            <input id="newPassword" type="password" oninput="checkStrength(this.value)"
              class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all" />
          </div>

          <!-- Strength -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex-1 bg-slate-100 rounded-full h-2 mr-3">
                <div id="strengthBar" class="h-2 rounded-full transition-all duration-300 bg-slate-200" style="width:0%"></div>
              </div>
              <span id="strengthLabel" class="text-xs font-medium text-slate-400 w-12 text-right"></span>
            </div>
            <div class="space-y-1.5">
              <div id="req1" class="flex items-center gap-2 text-sm text-slate-400"><span>○</span><span>Mínimo 8 caracteres</span></div>
              <div id="req2" class="flex items-center gap-2 text-sm text-slate-400"><span>○</span><span>Al menos una mayúscula</span></div>
              <div id="req3" class="flex items-center gap-2 text-sm text-slate-400"><span>○</span><span>Al menos un número</span></div>
            </div>
          </div>

          <!-- Confirm -->
          <div>
            <label id="confirmLabel" for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-2">Confirmar contraseña</label>
            <input id="confirmPassword" type="password"
              class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all" />
          </div>

          <button id="btn" type="submit"
            class="w-full bg-primary-600 hover:bg-primary-700 active:scale-95 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-primary-600/20 mt-2">
            Activar cuenta
          </button>
        </form>
      </div>

      <!-- Success -->
      <div id="successState" class="hidden text-center py-4">
        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
          <span class="text-4xl">🎉</span>
        </div>
        <h2 id="successTitle" class="font-display font-bold text-2xl text-slate-900 mb-3">¡Cuenta activada!</h2>
        <p id="successDesc" class="text-slate-500 text-sm mb-8">Tu contraseña ha sido establecida. Ya puedes iniciar sesión.</p>
        <a id="goLogin" href="login.html" class="inline-block bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-8 rounded-xl transition-all">Ir al inicio de sesión</a>
      </div>
    </div>
  </div>
</body>
</html>
