<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rexi — Olvidé mi contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans:['Inter','sans-serif'], display:['Outfit','sans-serif'] }, colors: { primary: { 50:'#f0fdfa',100:'#ccfbf1',500:'#14b8a6',600:'#0d9488',700:'#0f766e' } } } } }
    const t = {
      es: { back:'← Volver al inicio de sesión', title:'¿Olvidaste tu contraseña?', desc:'Ingresa tu correo y te enviaremos un enlace para restablecerla.', label:'Correo electrónico', placeholder:'tu@email.com', btn:'Enviar enlace', successTitle:'¡Revisa tu correo!', successDesc:'Si el correo está registrado, recibirás el enlace en los próximos minutos. Revisa también tu carpeta de spam.', newRequest:'Solicitar nuevo enlace' },
      en: { back:'← Back to sign in', title:'Forgot your password?', desc:"Enter your email and we'll send you a reset link.", label:'Email address', placeholder:'you@email.com', btn:'Send reset link', successTitle:'Check your inbox!', successDesc:"If the email is registered, you'll receive the link shortly. Check your spam folder too.", newRequest:'Request new link' }
    };
    let lang = 'es';
    function setLang(l) {
      lang = l;
      document.querySelectorAll('[data-lang-btn]').forEach(b => b.classList.toggle('font-bold', b.dataset.langBtn === l));
      document.getElementById('backLink').textContent = t[l].back;
      document.getElementById('formTitle').textContent = t[l].title;
      document.getElementById('formDesc').textContent = t[l].desc;
      document.getElementById('emailLabel').textContent = t[l].label;
      document.getElementById('emailInput').placeholder = t[l].placeholder;
      document.getElementById('submitBtn').textContent = t[l].btn;
      document.getElementById('successTitle').textContent = t[l].successTitle;
      document.getElementById('successDesc').textContent = t[l].successDesc;
      document.getElementById('newRequestBtn').textContent = t[l].newRequest;
    }
    function submit(e) {
      e.preventDefault();
      document.getElementById('formState').classList.add('hidden');
      document.getElementById('successState').classList.remove('hidden');
    }
    function reset() {
      document.getElementById('formState').classList.remove('hidden');
      document.getElementById('successState').classList.add('hidden');
    }
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary-50 to-slate-100 font-sans flex items-center justify-center px-4" onload="setLang('es')">
  <div class="w-full max-w-md">

    <!-- Lang + back -->
    <div class="flex items-center justify-between mb-8">
      <a id="backLink" href="login.html" class="text-sm text-slate-500 hover:text-primary-700 transition-colors">← Volver al inicio de sesión</a>
      <div class="flex items-center gap-1 bg-white rounded-xl p-1 shadow-sm border border-slate-200">
        <button data-lang-btn="es" onclick="setLang('es')" class="px-3 py-1.5 rounded-lg text-sm font-bold text-slate-700">ES</button>
        <button data-lang-btn="en" onclick="setLang('en')" class="px-3 py-1.5 rounded-lg text-sm text-slate-400 hover:bg-slate-50">EN</button>
      </div>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 md:p-10">

      <!-- Logo -->
      <div class="flex justify-center mb-8">
        <div class="w-16 h-16 bg-primary-600 rounded-2xl flex items-center justify-center shadow-lg shadow-primary-600/30">
          <span class="text-white font-display font-bold text-3xl">R</span>
        </div>
      </div>

      <!-- Form state -->
      <div id="formState">
        <h1 id="formTitle" class="font-display font-bold text-2xl text-slate-900 text-center mb-2">¿Olvidaste tu contraseña?</h1>
        <p id="formDesc" class="text-slate-500 text-center text-sm mb-8">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
        <form onsubmit="submit(event)" class="space-y-5">
          <div>
            <label id="emailLabel" for="emailInput" class="block text-sm font-medium text-slate-700 mb-2">Correo electrónico</label>
            <input id="emailInput" type="email" placeholder="tu@email.com" required
              class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all" />
          </div>
          <button id="submitBtn" type="submit"
            class="w-full bg-primary-600 hover:bg-primary-700 active:scale-95 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-primary-600/20">
            Enviar enlace
          </button>
        </form>
      </div>

      <!-- Success state -->
      <div id="successState" class="hidden text-center">
        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
          <span class="text-4xl">✅</span>
        </div>
        <h2 id="successTitle" class="font-display font-bold text-2xl text-slate-900 mb-3">¡Revisa tu correo!</h2>
        <p id="successDesc" class="text-slate-500 text-sm mb-8">Si el correo está registrado, recibirás el enlace en los próximos minutos. Revisa también tu carpeta de spam.</p>
        <button id="newRequestBtn" onclick="reset()" class="text-primary-600 hover:text-primary-700 font-medium text-sm">Solicitar nuevo enlace</button>
      </div>
    </div>
  </div>
</body>
</html>
